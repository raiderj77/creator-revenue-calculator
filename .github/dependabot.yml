# Version updates PAUSED 2026-11-23 (Jason's call): Renovate owns dependency
# version updates fleet-wide now. Dependabot security alerts stay enabled in
# repo settings; this file's limits are 0 so it opens no version-update PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 0
    groups:
      npm-maintenance:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:20"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 0
    groups:
      actions-maintenance:
        patterns:
          - "*"
